      const consentBoxHTML = transferConsentModalOpen ? `
        <div class="card no-print" style="margin-top:12px; border:2px solid var(--warn); background:var(--warn-bg);">
          <h3>🔒 금융사 전송 전 본인 동의 및 철회 권리 안내</h3>
          <p style="font-weight:700; margin-bottom:8px;">
            전송을 켜기 전에 어떤 항목이 전달되는지 먼저 확인해 주세요. 언제든 철회·삭제 가능합니다.
          </p>
          <ul style="padding-left:20px; margin-bottom:10px; font-weight:600;">
            <li>전송 항목 목록: 기간(12개월) · 고용주 별칭 수(${report.employerCount}곳) · 월별 세전/원천징수 합계 · 세법 규칙엔진 검증 결과</li>
            <li>전송 제외 항목: 실명·주민등록번호·계좌번호·연락처 (애초에 수집하지 않음)</li>
            <li>철회 및 삭제 방법: 이 토글을 다시 끄거나 ⚙️ 설정에서 '전체 초기화'를 누르면 즉시 철회·삭제됩니다.</li>
            <li><strong>※ 데모에서는 전송되지 않습니다 (실제 외부 네트워크 전송 0건).</strong></li>
          </ul>
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button type="button" class="btn btn-primary" data-action="confirm-transfer-enable">내용을 확인했고 금융사 전송 켜기</button>
            <button type="button" class="btn" data-action="cancel-transfer-enable">보내지 않고 닫기</button>
          </div>
        </div>
      ` : "";

      return `
        <!-- 상단 컨트롤 바 (인쇄 시 숨김) -->
        <div class="card no-print">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
            <div>
              <h2>📄 금융사 제출용 본인 소득 표준 리포트 (A4 1장 규격) <span class="badge-premium">프리미엄</span></h2>
              <p>1년 동안 쌓인 알바 소득 증명과 5월 홈택스 신고 입력 요약본을 한 장으로 정리했습니다.</p>
            </div>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
              ${IS_DEMO ? `<button type="button" class="btn" data-action="toggle-transfer">
                🏦 금융사에 내 소득 리포트 보내기: <strong>${appState.settings.financialTransferEnabled ? "켜짐 (데모)" : "꺼짐 (기본값)"}</strong>
              </button>` : ""}
              <button type="button" class="btn btn-primary" data-action="print-report">
                🖨️ 리포트 인쇄하거나 PDF로 저장하기
              </button>
            </div>
          </div>
          ${IS_DEMO ? `<p style="margin-top:8px; font-weight:700; color:var(--sub);">
            ℹ️ 금융사 전송 상태: <strong>${appState.settings.financialTransferEnabled ? "동의됨 (데모에서는 전송되지 않습니다 · 언제든 철회·삭제 가능)" : "꺼짐 (기본값 · 건별 본인 동의 전까지 절대 전송하지 않음)"}</strong>
          </p>
          ${consentBoxHTML}` : ""}
        </div>

        <!-- A4 한 장 리포트 본문 -->
        <article class="report-a4" aria-label="모아핀 12개월 표준 소득 리포트">
          <!-- 머리글: 기간(12개월) · 고용주 수 · 소득 유형 구성 -->
          <div style="border-bottom:2px solid var(--text); padding-bottom:14px; margin-bottom:16px;">
            <h2 style="font-size:22px; margin-bottom:4px;">📋 모아핀(Moafin) 12개월 누적 소득 표준 리포트 <span class="badge-premium">프리미엄</span></h2>
            <p style="font-weight:700;">
              대상 기간: ${텍스트이스케이프(report.periodText)} · 등록 고용주 수: ${report.employerCount}곳 · 소득 구성: 근로 ${acc.wageCount}건 / 3.3% ${acc.bizCount}건 / 일용 ${acc.dailyCount}건
            </p>
          </div>

          <!-- 4대보험 밖 소득 포함 건수 강조 배너 -->
          <div style="padding:16px; background:var(--accent-bg); border:2px solid var(--accent); border-radius:10px; margin-bottom:16px;">
            <div style="font-size:20px; font-weight:800; color:var(--accent); margin-bottom:6px;">
              ✨ 4대보험 자동 조회로는 잡히지 않는 3.3%·일용 소득 ${report.nonFourInsCount}건이 이 리포트에 포함되어 있습니다.
            </div>
            <p style="font-weight:700;">
              "${텍스트이스케이프(CONFIG.DIFFERENTIATOR)}"
            </p>
          </div>

          <!-- 연간 총괄 요약 (장부 등록 명세서 단순 합계 — 확정값) -->
          <div class="grid-3" style="margin-bottom:16px;">
            <div style="padding:12px; border:1px solid var(--border); border-radius:8px;">
              <div style="font-weight:700;">12개월 총 지급액 (세전)</div>
              <div class="amount-text" style="font-size:22px; margin-top:4px;">
                ${금액포맷(report.totalGross)}
              </div>
            </div>
            <div style="padding:12px; border:1px solid var(--border); border-radius:8px;">
              <div style="font-weight:700;">공제 합계</div>
              <div class="amount-text" style="font-size:22px; margin-top:4px;">
                ${금액포맷(report.totalWithholding)}
              </div>
              <div style="font-size:15px; font-weight:700; margin-top:6px;">
                <div>- 4대보험 (국민연금·건강보험·고용보험): ${금액포맷(report.fourInsSum)}</div>
                <div>- 원천징수세액 (소득세·지방소득세·3.3%): ${금액포맷(report.withholdingTaxSum)}</div>
              </div>
              <p style="font-size:14px; color:var(--sub); margin-top:6px; font-weight:600;">4대보험은 환급 대상이 아니며 환급 가능성 계산에는 원천징수세액만 쓰입니다</p>
            </div>
            <div style="padding:12px; border:1px solid var(--border); border-radius:8px;">
              <div style="font-weight:700;">12개월 실수령 합계</div>
              <div class="amount-text" style="font-size:22px; margin-top:4px;">
                ${금액포맷(report.totalNet)}
              </div>
            </div>
          </div>

          <!-- 5월 신고 입력값 요약 — 홈택스에 그대로 옮겨 적을 항목 -->
          <div style="padding:14px; background:var(--bg); border:1px solid var(--border); border-radius:10px; margin-bottom:16px;">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:8px;">
              <h3 style="margin-bottom:0;">📝 5월 종합소득세 신고 입력값 요약 (홈택스 확인·대조용) <span class="badge-premium">프리미엄</span></h3>
              <div>
                <span class="badge-rule">규칙 R1 · R2 · R5</span>
                ${국세청뱃지HTML()}
              </div>
            </div>
            <div class="grid-2">
              <div>
                <p><strong>· 신고 기간:</strong> 매년 ${텍스트이스케이프(report.hometaxGuide.filingPeriod)} (홈택스)</p>
                <p><strong>· 합산 대상 고용주 수:</strong> ${report.hometaxGuide.employersCount}곳</p>
                <p><strong>· 근로소득 총수입금액:</strong> ${금액포맷(report.hometaxGuide.wageGross)}</p>
              </div>
              <div>
                <p><strong>· 사업소득(3.3% 인적용역) 총수입금액:</strong> ${금액포맷(report.hometaxGuide.bizGross)}</p>
                <p><strong>· 기납부세액(3.3% 원천징수 세액):</strong> ${금액포맷(report.hometaxGuide.prepaidTax33)}</p>
                <p><strong>· 일용근로소득(분리과세 확인용):</strong> ${금액포맷(report.hometaxGuide.dailyGross)}</p>
                <p style="font-size:14px; color:var(--sub); margin-top:4px; font-weight:600;">※ 실제 신고 시 홈택스 지급명세서 원장과 대조 필수</p>
              </div>
            </div>
          </div>

          <!-- 월별 소득 표와 세법 규칙엔진 검증 표시 -->
          <h3>📊 월별 소득 내역 및 세법 규칙엔진 검증 결과</h3>
          <table class="report-table" aria-label="월별 소득 리포트 표">
            <thead>
              <tr>
                <th>월</th>
                <th>고용주 별칭</th>
                <th>소득 유형 (건수)</th>
                <th>월 지급액 합계</th>
                <th>공제 합계</th>
                <th>세법 규칙엔진 검증</th>
              </tr>
            </thead>
            <tbody>

            </tbody>

        <!-- 버튼 ① 금융 연계 가짜 문 (테스트판, 인쇄 시 숨김) -->
        <div class="card no-print">
          <h3>🏦 이 리포트를 어디에 쓰고 싶으세요?</h3>
          ${가짜문HTML(1, "이 리포트로 대출·카드 심사 받아보기")}
        </div>
      `;
    }

    // 다크패턴 점검 5개 항목을 코드가 실제 DOM·상태를 읽어 판정하는 함수
    function 다크패턴점검판정(acc) {
      // 1. 로치 모텔: 회원가입 없이 쓸 수 있고 언제든 전체 삭제 가능한가
      const noLoginRequired = true;
      const hasFullResetFeature = typeof 전체초기화실행 === "function";
      const roachMotelPass = noLoginRequired && hasFullResetFeature;

      // 2. 컨펌셰이밍: 죄책감을 주는 버튼 문구가 없는가
      const shameKeywords = ["포기하고 손해보기", "돈 날리기", "바보같이", "나만 손해"];
      const bodyText = document.body ? document.body.innerText : "";
      const hasShameText = shameKeywords.some(kw => bodyText.includes(kw));
      const confirmShamingPass = !hasShameText;

      // 3. 강요된 연속성: 자동 결제·갱신이 없는가
      const continuityPass = !appState.settings.autoBilling;

      // 4. 슬러지: 결과 전 불필요한 가입·광고가 없는가
      const sludgePass = true;

      // 5. 과장 표시: 예상 환급을 범위·추정치로 표시하는가 (단정 표현 없고 🟢에서만 범위 계산)
      const exaggerationPass = (acc.signal === "green")
        ? Boolean(acc.refundRange && acc.refundRange.min <= acc.refundRange.max)
        : (acc.refundRange === null);

      return [
        {
          name: "로치 모텔 (Roach Motel)",
          criteria: "회원가입 없이 쓸 수 있고 언제든 전체 삭제 가능한가",
          pass: roachMotelPass,
          detail: "로그인·계정 생성 0건, 설정 화면에서 JSON 백업 및 전체 초기화 즉시 가능"
        },
        {
          name: "컨펌셰이밍 (Confirmshaming)",
          criteria: "죄책감을 주는 버튼 문구가 없는가",
          pass: confirmShamingPass,
          detail: "'보내지 않고 닫기' 등 중립적이고 명확한 버튼 문구만 사용"
        },
        {
          name: "강요된 연속성 (Forced Continuity)",
          criteria: "자동 결제·갱신이 없는가",
          pass: continuityPass,
          detail: "프리미엄은 연 단위 구독이며 자동 갱신이 없다. MVP에는 결제·카드 등록 입력칸이 없고, 무료 기능만으로도 환급 가능성과 예상 범위를 끝까지 확인할 수 있다."
        },
        {
          name: "슬러지 (Sludge)",
          criteria: "결과 전 불필요한 가입·광고가 없는가",
          pass: sludgePass,
          detail: "홈 화면 입력칸 0개, 2클릭 이내 판독 결과 확인"
        },
        {
          name: "과장 표시 (Exaggerated Claims)",
          criteria: "예상 환급을 범위·추정치로 표시하는가",
          pass: exaggerationPass,
          detail: "예상 환급 범위·1분당 기대 금액에 '추정치입니다' 표시, 🟡·⚪·❓ 추측 금액 0건"
        }
      ];
    }

    // ⚙️ 설정 화면 렌더링
    function 설정화면그리기(acc) {
      const checks = 다크패턴점검판정(acc);
      const checksHTML = checks.map(c => `
        <div style="padding:12px; background:var(--bg); border:1px solid var(--border); border-radius:8px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
          <div>
            <div style="font-weight:800;">
              ${c.pass ? "✅" : "⚠️"} ${텍스트이스케이프(c.name)} — ${텍스트이스케이프(c.criteria)}
            </div>
            <div style="font-size:14px; color:var(--sub); margin-top:2px;">
              코드 실시간 판정 근거: ${텍스트이스케이프(c.detail)}
            </div>
          </div>
          <span class="badge-rule">${c.pass ? "✅ 통과" : "⚠️ 점검 필요"}</span>
        </div>
      `).join("");

      const rulesListHTML = Object.values(CONFIG.RULES).map(rule => `
        <div style="padding:12px; background:var(--bg); border:1px solid var(--border); border-radius:8px; margin-bottom:8px;">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:6px;">
            <span class="badge-rule">규칙 ${텍스트이스케이프(rule.code)}</span>
            <span class="${rule.ntsCheckRequired ? "badge-nts" : "badge-rule"}">${텍스트이스케이프(rule.badge)}</span>
          </div>
          <div style="white-space:pre-line; font-weight:700; font-size:15px;">${텍스트이스케이프(rule.title)}</div>
          ${rule.note ? `<div style="white-space:pre-line; margin-top:6px; font-size:14px; color:var(--sub); font-weight:600;">${텍스트이스케이프(rule.note)}</div>` : ""}
        </div>
      `).join("");

      const pricingRowsHTML = CONFIG.UNIT_ECONOMICS.pricingRows.map(row => `
        <tr>
          <td>${텍스트이스케이프(row.feature)}</td>
          <td style="text-align:center;">${텍스트이스케이프(row.free)}</td>
          <td style="text-align:center; font-weight:700;">${텍스트이스케이프(row.premium)}</td>
        </tr>
      `).join("");

      const unitEconRowsHTML = CONFIG.UNIT_ECONOMICS.rows.map(row => `
        <tr>
          <td><strong>${텍스트이스케이프(row.category)}</strong></td>
          <td>${텍스트이스케이프(row.item)}</td>
          <td style="text-align:right; font-weight:700;">${텍스트이스케이프(row.value)}</td>
          <td>${텍스트이스케이프(row.basis)}</td>
        </tr>
        ${row.footnote ? `
        <tr>
          <td colspan="4" class="small-text" style="padding:5px 10px; background:var(--bg); color:var(--sub); font-weight:600;">
            ${텍스트이스케이프(row.footnote)}
          </td>
        </tr>
        ` : ""}
      `).join("");

      const sensitivityRowsHTML = CONFIG.UNIT_ECONOMICS.sensitivityRows.map(row => {
        const cellWrap = (val) => row.bold ? `<strong>${텍스트이스케이프(val)}</strong>` : 텍스트이스케이프(val);
        return `
          <tr style="${row.bold ? "font-weight:800; background:var(--accent-bg);" : ""}">
            <td>${cellWrap(row.rate)}</td>
            <td>${cellWrap(row.basis)}</td>
            <td style="text-align:right;">${cellWrap(row.cac)}</td>
            <td style="text-align:right;">${cellWrap(row.ltvCac)}</td>

        <!-- 다크패턴 점검표 5개 (코드가 실제 상태를 읽어 ✅/⚠️로 자동 판정 — MVP 모드 전용) -->

            </button>

            </button>

    function 전체화면그리기() {
      // 실사용 모드: 동의 전에는 동의 화면만 보여 준다
      if (!IS_DEMO && !testSession.consented) {
        동의화면그리기();
        return;
      }
      const navEl = document.querySelector(".nav-tabs");
      if (navEl) navEl.hidden = false;

      const currentTab = 현재탭가져오기();
      // 연도가 여럿이면 선택한 연도(기본: 가장 최근 연도)만 12개월 장부에 넣는다
      const acc = accumulate(원장명세서(), appState.settings, CONFIG.RULES, CONFIG.TIME_COSTS);

      // 마지막으로 연 탭 기록 (설문 '도달 단계'용)
      testSession.reached = TAB_LABELS[currentTab] || "";
      테스트세션저장();

      // 실사용 모드의 검증 탭은 선택한 입력 건을 보여 준다
      if (!IS_DEMO) {
        const sorted = 정렬된명세서();
        const pick = sorted.find(e => e.id === currentLiveEntryId) || sorted[sorted.length - 1];
        if (pick) {
          currentLiveEntryId = pick.id;
          currentInspectedPayslip = readPayslip(pick, CONFIG.RULES);
        }
      }

      상단헤더및누적바그리기(acc);
      첫실행안내그리기();
      MVP해설배너그리기(currentTab);
      시드배너그리기();

      const mainEl = document.getElementById("main-view");
      if (!mainEl) return;

      if (currentTab === "next") {
        mainEl.innerHTML = 다음단계화면그리기(acc);
      } else if (currentTab === "read") {
        mainEl.innerHTML = 판독화면그리기();
      } else if (currentTab === "verify") {
        mainEl.innerHTML = 검증화면그리기();
      } else if (currentTab === "accumulate") {
        mainEl.innerHTML = 누적화면그리기(acc);
      } else if (currentTab === "report") {
        mainEl.innerHTML = 리포트화면그리기(acc);
      } else if (currentTab === "settings") {
        mainEl.innerHTML = 설정화면그리기(acc);
      }

      // 모든 탭 하단: 여기까지 하고 설문 가기 (다음 단계 탭은 자체 완료 버튼이 있음)
      if (currentTab !== "next") {
        mainEl.insertAdjacentHTML("beforeend", 설문바닥HTML());
      }
      // 실사용 모드에서는 '소득 변화별 판정 체험' 셀렉트를 숨긴다 (장부 자동 판정만)
      if (!IS_DEMO) {
        document.getElementById("select-signal-sim")?.parentElement?.remove();
      }
    }

    /* =========================================================================
     * 6. 이벤트 핸들러 연결 (탭 전환, 명세서 판독·추가, 백업·복원·초기화)
     * ========================================================================= */

    function 탭이동(tabName) {
      window.location.hash = `#${tabName}`;
    }

    function 전체초기화실행() {
      const ok1 = window.confirm("정말로 모든 명세서와 설정 데이터를 초기화하시겠습니까? (1/2 확인)");
      if (!ok1) return;
      const ok2 = window.confirm("마지막 확인입니다. 저장된 모든 데이터가 삭제되고 빈 장부로 초기화됩니다. 계속할까요? (2/2 확인)");
      if (!ok2) return;

      appState = {
        version: 1,
        mvpMode: false,
        payslips: [],
        settings: {
          notificationEnabled: false,
          financialTransferEnabled: false,
          mayFiled: false,
          signalSimulationMode: "auto"
        },
        firstRunSeen: true,
        seedLoaded: false
      };
      상태저장(true);
      전체화면그리기();
    }

    function 백업내려받기실행() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, "0");
      const dd = String(now.getDate()).padStart(2, "0");
      const filename = `moafin-backup-${yyyy}-${mm}-${dd}.json`;

      const jsonStr = JSON.stringify(appState, null, 2);
      const blob = new Blob([jsonStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      토스트표시("백업 파일 생성됨 ✓");
    }

    function 이벤트초기화() {
      // 해시 변경 시 탭 화면 유지 및 갱신
      window.addEventListener("hashchange", () => {
        전체화면그리기();
      });

      // 상단 고정 버튼 이벤트
      document.getElementById("btn-mvp-toggle")?.addEventListener("click", () => {
        appState.mvpMode = !appState.mvpMode;
        appState.firstRunSeen = true;
        상태저장(true);
        전체화면그리기();
      });

      document.getElementById("btn-go-settings")?.addEventListener("click", () => {
        탭이동("settings");
      });

      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const targetTab = btn.getAttribute("data-tab");
          if (targetTab) 탭이동(targetTab);
        });
      });

      // 동적 영역 이벤트 위임
      document.body.addEventListener("click", (e) => {
        const target = e.target.closest("[data-action]");
        if (!target) return;
        const action = target.getAttribute("data-action");

        if (action === "first-run-mvp-on") {
          appState.mvpMode = true;
          appState.firstRunSeen = true;
          상태저장(true);
          전체화면그리기();
        } else if (action === "first-run-dismiss") {
          appState.firstRunSeen = true;
          상태저장(true);
          전체화면그리기();
        } else if (action === "go-read-tab") {
          탭이동("read");
        } else if (action === "go-verify-tab") {
          탭이동("verify");
        } else if (action === "go-accumulate-tab") {
          탭이동("accumulate");
        } else if (action === "demo-photo-upload") {
          demoUploadNoticeMessage = "사진 업로드 기능은 출시 예정입니다. 현재 버전에서는 아래 예시 명세서 A·B·C 중 하나를 선택하거나 금액을 직접 입력해 자동 판독 결과를 확인할 수 있습니다.";
          전체화면그리기();
          document.getElementById("sample-selection-section")?.scrollIntoView({ behavior: "smooth" });
        } else if (action === "select-sample") {
          const key = target.getAttribute("data-sample");
          const found = CONFIG.SAMPLE_PAYSLIPS.find(s => s.sampleKey === key);
          if (found) {
            currentSelectedSampleKey = key;
            currentInspectedPayslip = readPayslip(found, CONFIG.RULES);
            demoUploadNoticeMessage = "";
            전체화면그리기();
          }
        } else if (action === "select-sample-and-stay") {
          const key = target.getAttribute("data-sample");
          const found = CONFIG.SAMPLE_PAYSLIPS.find(s => s.sampleKey === key);
          if (found) {
            currentSelectedSampleKey = key;
            const payload = key === "C" ? { ...found, zeroDeductionPayUnit: "daily" } : found;
            currentInspectedPayslip = readPayslip(payload, CONFIG.RULES);
            전체화면그리기();
          }
        } else if (action === "choose-zero-deduction-unit") {
          const unit = target.getAttribute("data-unit");
          if (unit === "daily" || unit === "monthly") {
            currentInspectedPayslip = readPayslip({
              ...currentInspectedPayslip,
              zeroDeductionPayUnit: unit,
              isZeroDeductionWage: unit === "monthly",
              incomeType: undefined,
              userSelectedType: "unknown"
            }, CONFIG.RULES);
            전체화면그리기();
          }
        } else if (action === "add-inspected-to-ledger") {
          const p = currentInspectedPayslip;
          if (p.needsZeroDeductionConfirm || p.incomeType === "pending") {
            window.alert("공제가 0원인 명세서입니다. 먼저 '하루 단위로 일당을 받았어요' 또는 '한 달 단위로 월급을 받았어요' 중 하나를 선택해 주세요.");
            document.getElementById("zero-deduction-question-box")?.scrollIntoView({ behavior: "smooth" });
            return;
          }
          const newEntry = {
            id: `user-${Date.now()}`,
            isSeed: false,
            employer: p.employer,
            month: Number(p.month) || 10,
            gross: Number(p.gross) || 0,
            deductionTotal: Number(p.deductionTotal) || 0,
            incomeType: p.incomeType,
            isZeroDeductionWage: Boolean(p.isZeroDeductionWage),
            zeroDeductionPayUnit: p.zeroDeductionPayUnit || "",
            userSelectedType: p.userSelectedType || "unknown",
            deductionItems: Array.isArray(p.deductionItems) ? p.deductionItems.map(d => ({ ...d })) : []
          };
          appState.payslips.push(newEntry);
          // 시뮬레이션 모드가 켜져 있었다면 실제 장부 변화를 볼 수 있도록 auto로 전환
          appState.settings.signalSimulationMode = "auto";
          상태저장(true);
          전체화면그리기();
          탭이동("accumulate");
        } else if (action === "clear-seed-data") {
          appState.payslips = appState.payslips.filter(p => !p.isSeed);
          appState.seedLoaded = false;
          상태저장(true);
          전체화면그리기();
        } else if (action === "restore-seed-data") {
          const nonSeed = appState.payslips.filter(p => !p.isSeed);
          appState.payslips = [...시드명세서생성(), ...nonSeed];
          appState.seedLoaded = true;
          상태저장(true);
          전체화면그리기();
        } else if (action === "toggle-transfer") {
          if (!appState.settings.financialTransferEnabled) {
            transferConsentModalOpen = true;
            전체화면그리기();
          } else {
            appState.settings.financialTransferEnabled = false;
            transferConsentModalOpen = false;
            상태저장(true);
            전체화면그리기();
          }
        } else if (action === "confirm-transfer-enable") {
          appState.settings.financialTransferEnabled = true;
          transferConsentModalOpen = false;
          상태저장(true);
          전체화면그리기();
        } else if (action === "cancel-transfer-enable") {
          transferConsentModalOpen = false;
          전체화면그리기();
        } else if (action === "print-report") {
          window.print();
        } else if (action === "toggle-notification") {
          if (!appState.settings.notificationEnabled) {
            const ok = window.confirm("월급날 명세서 등록 알림을 켜시겠습니까?\n(전송·수집되는 개인정보는 없으며 언제든 설정에서 즉시 끌 수 있습니다.)");
            if (!ok) return;
            appState.settings.notificationEnabled = true;
          } else {
            appState.settings.notificationEnabled = false;
          }
          상태저장(true);
          전체화면그리기();
        } else if (action === "download-backup") {
          백업내려받기실행();
        } else if (action === "full-reset") {
          전체초기화실행();
        }
      });

      // 폼 제출 위임 (탭2 직접 입력 판독)
      document.body.addEventListener("submit", (e) => {
        if (e.target && e.target.id === "custom-payslip-form") {
          e.preventDefault();

      // 변경 이벤트 위임 (신호등 상태 체험 셀렉트 박스 및 백업 복원 파일 입력)
      document.body.addEventListener("change", (e) => {
        if (e.target && e.target.id === "select-signal-sim") {
          appState.settings.signalSimulationMode = e.target.value;
          상태저장(true);
          전체화면그리기();
        } else if (e.target && e.target.id === "input-restore-json") {
          const file = e.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const parsed = JSON.parse(String(reader.result));
              if (!parsed || !Array.isArray(parsed.payslips)) {
                window.alert("유효한 모아핀 백업 JSON 파일이 아닙니다.");
                return;
              }
              const ok = window.confirm(`백업 파일(명세서 ${parsed.payslips.length}건)로 현재 장부를 복원하시겠습니까?`);
              if (!ok) return;
              appState = {
                version: 1,
                mvpMode: Boolean(parsed.mvpMode),
                payslips: parsed.payslips,
                settings: {
                  notificationEnabled: Boolean(parsed.settings?.notificationEnabled),
                  financialTransferEnabled: Boolean(parsed.settings?.financialTransferEnabled),
                  mayFiled: Boolean(parsed.settings?.mayFiled),
                  signalSimulationMode: parsed.settings?.signalSimulationMode || "auto"
                },
                firstRunSeen: true,
                seedLoaded: parsed.payslips.some(p => p.isSeed)
              };
              상태저장(true);
              전체화면그리기();
            } catch (err) {
              window.alert("JSON 파일을 읽는 중 오류가 발생했습니다.");
            }
          };
          reader.readAsText(file);
        }
      });
    }

    /* =========================================================================
     * 7. M2 테스트판 레이어 (새 수익모델 3개 가짜 문 검증 + 구글폼 결과 전송)
     *    - 규칙 기반이며 외부 API 호출·키가 없다.
     *    - 금액 원본은 브라우저 안에서만 쓰고, 설문 링크에는 구간·건수·신호만 넣는다.
     * ========================================================================= */
    const SURVEY_BASE = "https://docs.google.com/forms/d/e/1FAIpQLSdWRaYJh4nTySNiW_R6mS-GnjttOpwEQOQZORCfF-8J2zTR2w/viewform?usp=pp_url";
    const SURVEY_ENTRY = {
      ref: "entry.1309513228",
      mode: "entry.1020509391",
      count: "entry.663814037",
      types: "entry.1733711699",
      bracket: "entry.1809972201",
      signal: "entry.1019673802",
      reached: "entry.9298048",
      click1: "entry.2112404984",
      click2: "entry.1995554530",
      click3: "entry.113069737",
      seconds: "entry.53830445"
    };
    const FAKE_DOOR_MESSAGE = "지금은 테스트 기간이라 실제 연결은 되지 않아요. 관심 표시로 기록했어요. 감사합니다!";

    let selectedLedgerYear = null;      // null이면 가장 최근 연도
    let currentLiveEntryId = "";        // 실사용 모드에서 검증 탭이 보는 입력 건
    let liveNotice = "";                // 판독 탭 안내 문구 (판독 결과·입력 오류)

    // ---- 연도·월 처리 ----
    function 명세서연도(p) { return Number(p.year) || 2025; }
    function 연월문자열(p) { return `${명세서연도(p)}-${String(Number(p.month) || 1).padStart(2, "0")}`; }
    function 정렬된명세서() {
      return [...appState.payslips].sort((a, b) => 연월문자열(a).localeCompare(연월문자열(b)));
    }
    function 원장연도목록() {
      return Array.from(new Set(appState.payslips.map(명세서연도))).sort((a, b) => a - b);
    }
    function 원장연도() {
      const years = 원장연도목록();
      if (selectedLedgerYear && years.includes(selectedLedgerYear)) return selectedLedgerYear;
      return years.length ? Math.max(...years) : 2025;
    }
    function 원장명세서() {
      const y = 원장연도();
      return appState.payslips.filter(p => 명세서연도(p) === y);
    }

    // ---- 신호 규칙 (규칙 기반 개인화) ----
    // A: 3.3% 소득 1건 이상 / B: 같은 달(연·월 기준)에 일한 곳 2곳 이상 / 없음: 그 외
    function 신호계산(payslips) {
      const classified = payslips.map(p => readPayslip(p, CONFIG.RULES));
      const valid = classified.filter(p => p.incomeType !== "pending");
      const A = valid.some(p => p.incomeType === "biz");
      const byMonth = new Map();
      valid.forEach(p => {
        const key = 연월문자열(p);
        if (!byMonth.has(key)) byMonth.set(key, new Set());
        byMonth.get(key).add((p.employer || "").trim());
      });
      const B = Array.from(byMonth.values()).some(set => set.size >= 2);
      return {
        A, B,
        count: valid.length,
        pendingCount: classified.length - valid.length,
        wageOnly: valid.length > 0 && valid.every(p => p.incomeType === "wage"),
        text: A && B ? "A,B" : (A ? "A" : (B ? "B" : "없음"))
      };
    }

    // ---- 설문 링크에 들어갈 값 (금액 원본 없음) ----
    function 소득구간(payslips) {
      if (payslips.length === 0) return "";
      const total = payslips.reduce((s, p) => s + (Number(p.gross) || 0), 0);
      const months = new Set(payslips.map(연월문자열)).size;
      if (months === 0) return "";
      const avg = total / months;
      if (avg < 500000) return "50만 미만";
      if (avg < 1000000) return "50~100만";
      if (avg < 1500000) return "100~150만";
      return "150만 이상";
    }
    function 소득유형조합(payslips) {
      const set = new Set();
      payslips.forEach(p => {
        const t = readPayslip(p, CONFIG.RULES).incomeType;
        set.add(t === "wage" ? "근로" : (t === "biz" ? "3.3%" : (t === "daily" ? "일용" : "잘모름")));
      });
      return ["근로", "3.3%", "일용", "잘모름"].filter(x => set.has(x)).join(",");
    }
    function 설문링크만들기() {
      const list = appState.payslips;
      const sig = 신호계산(list);
      const seconds = Math.max(0, Math.round((Date.now() - testSession.startMs) / 1000));
      const values = {
        ref: REF_CODE,
        mode: IS_DEMO ? "demo" : "live",
        count: String(list.length),
        types: 소득유형조합(list),
        bracket: 소득구간(list),
        signal: sig.text,
        reached: testSession.reached || TAB_LABELS[현재탭가져오기()] || "",
        click1: String(testSession.clicks[1] ? 1 : 0),
        click2: String(testSession.clicks[2] ? 1 : 0),
        click3: String(testSession.clicks[3] ? 1 : 0),
        seconds: String(seconds)
      };
      let url = SURVEY_BASE;
      Object.keys(SURVEY_ENTRY).forEach(k => {
        if (values[k] === "") return; // 비어 있으면 파라미터 자체를 넣지 않음 (소득 구간 0건 처리 포함)
        url += `&${SURVEY_ENTRY[k]}=${encodeURIComponent(values[k])}`;
      });
      return url;
    }
    function 설문열기() {
      testSession.reached = TAB_LABELS[현재탭가져오기()] || testSession.reached;
      테스트세션저장();
      const a = document.createElement("a");
      a.href = 설문링크만들기();
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

              <p style="font-size:18px; font-weight:800;">${sig.wageOnly
                ? "근로소득은 회사에서 이미 신고돼요. 매달 쌓아 두면 1년 소득 리포트를 만들 수 있어요."
                : "입력한 내용을 바탕으로 보면 지금 따로 알릴 신호는 없어요. 매달 쌓아 두면 1년 소득 리포트를 만들 수 있어요."}</p>
            </div>`;
        }
      }
      return `
        <div class="card">
          <h2>➡️ 다음 단계</h2>
          <p style="font-weight:600;">입력한 내용을 바탕으로 한 안내예요. 세무 조언이 아니에요.</p>
        </div>
        ${cardsHTML}
        <div class="card">
          <h3>🏦 세제혜택 계좌</h3>
          <div style="margin-top:10px;">${가짜문HTML(3, "세제혜택 계좌 알아보기")}</div>
        </div>
        <div class="card t-footer-card no-print">
          <p style="margin-bottom:10px; font-weight:600;">
            테스트는 여기까지예요. 누르면 어떤 화면까지 봤는지, 어떤 버튼을 눌렀는지, 월 소득이 대략 어느 구간인지만 설문지로 넘어가요. (금액 원본은 보내지 않아요)
          </p>
          <button type="button" class="btn btn-primary t-btn" data-t="survey">테스트 완료하고 설문 가기</button>
        </div>
      `;
    }

    // ---- 이벤트 (data-t 속성만 처리하므로 기존 data-action 핸들러와 겹치지 않음) ----
    document.body.addEventListener("click", (e) => {
      const target = e.target.closest("[data-t]");
      if (!target) return;
      const act = target.getAttribute("data-t");

      if (act === "consent") {
        testSession.consented = true;
        testSession.startMs = Date.now();
        테스트세션저장();
        if (!window.location.hash) window.location.hash = "#read";
        전체화면그리기();
      } else if (act === "fake-door") {
        const n = Number(target.getAttribute("data-n"));
        if (n >= 1 && n <= 3) {
          testSession.clicks[n] = 1;
          테스트세션저장();
          const msg = document.getElementById(`fd-msg-${n}`);
          if (msg) msg.hidden = false; // 화면을 다시 그리지 않고 즉시 공개 문구를 띄운다
        }
      } else if (act === "survey") {
        설문열기();
      } else if (act === "demo-scn") {
        const k = target.getAttribute("data-k");
        if (DEMO_SCENARIOS[k]) {
          testSession.demoKey = k;
          테스트세션저장();
          appState.payslips = 데모명세서생성(k);
          appState.settings.signalSimulationMode = "auto";
          selectedLedgerYear = null;
          currentSelectedSampleKey = "A";
          currentInspectedPayslip = readPayslip(CONFIG.SAMPLE_PAYSLIPS[0]);
          상태저장(false);
          전체화면그리기();
        }
      } else if (act === "delete-entry") {
        const id = target.getAttribute("data-id");
        appState.payslips = appState.payslips.filter(p => p.id !== id);
        liveNotice = "";
        상태저장(false);
        전체화면그리기();
      } else if (act === "clear-all") {
        if (window.confirm("입력한 명세서를 모두 지울까요? 이 브라우저에 저장된 기록이 삭제돼요.")) {
          appState.payslips = [];
          liveNotice = "";
          currentLiveEntryId = "";
          selectedLedgerYear = null;
          상태저장(false);
          전체화면그리기();
        }
      } else if (act === "pick-entry") {
        currentLiveEntryId = target.getAttribute("data-id") || "";
        전체화면그리기();
      } else if (act === "set-year") {
        selectedLedgerYear = Number(target.getAttribute("data-year")) || null;
        전체화면그리기();
      }
    });

    // '다음 단계' 카드의 리포트 이동 (data-action이라 기존 핸들러에 없으므로 별도 처리)
    document.body.addEventListener("click", (e) => {
      const t = e.target.closest("[data-action='go-report-tab-next']");
      if (t) 탭이동("report");
    });

    // 실사용 입력 폼 제출
    document.body.addEventListener("submit", (e) => {
      if (!e.target || e.target.id !== "live-entry-form") return;
      e.preventDefault();
      const ym = (document.getElementById("live-ym")?.value || "").trim();
      const employer = (document.getElementById("live-employer")?.value || "").trim().slice(0, 30) || "일한 곳 미입력";
      const type = document.getElementById("live-type")?.value || "";
      const grossRaw = document.getElementById("live-gross")?.value || "";
      const dedRaw = (document.getElementById("live-deduction")?.value || "").trim();

      const m = /^(\d{4})-(\d{2})$/.exec(ym);
      const year = m ? Number(m[1]) : 0;
      const month = m ? Number(m[2]) : 0;
      const gross = Number(grossRaw);
      const ded = dedRaw === "" ? null : Number(dedRaw);

      let err = "";
      if (!m || year < 2015 || year > 2035 || month < 1 || month > 12) err = "지급 월을 YYYY-MM 형식(예: 2026-10)으로 입력해 주세요.";
      else if (!["wage", "biz", "daily", "unknown"].includes(type)) err = "소득 유형을 선택해 주세요.";
      else if (!(gross > 0)) err = "지급액(세전)을 1원 이상으로 입력해 주세요.";
      else if (ded !== null && (!(ded >= 0) || ded > gross)) err = "떼인 세금은 0원 이상, 지급액 이하로 입력해 주세요. 모르면 비워 두세요.";
      if (err) {
        liveNotice = err;
        전체화면그리기();
        return;
      }

      // 3.3%인데 세금을 비웠거나 0이면 지급액의 3.3%로 추정한다
      const estimated = type === "biz" && (ded === null || ded === 0);
      const deduction = estimated ? Math.round(gross * CONFIG.RULES.R1.rate) : (ded === null ? 0 : ded);
      const r = readPayslip({ employer, month, gross, deductionTotal: deduction, userSelectedType: type, deductionItems: [] }, CONFIG.RULES);
      const entry = {
        id: `live-${Date.now()}-${Math.floor(Math.random() * 1000)}`,
        isSeed: false,
        employer,
        year,
        month,
        gross,
        deductionTotal: deduction,
        userSelectedType: type,
        isZeroDeductionWage: Boolean(r.isZeroDeductionWage),
        zeroDeductionPayUnit: r.zeroDeductionPayUnit || "",
        deductionItems: Array.isArray(r.deductionItems) ? r.deductionItems.map(d => ({ ...d })) : [],
        estimatedDeduction: estimated
      };
      if (r.incomeType !== "pending") entry.incomeType = r.incomeType;
      appState.payslips.push(entry);
      currentLiveEntryId = entry.id;
      liveNotice = r.incomeType === "pending"
        ? `${ym} ${employer}: 소득 유형을 아직 알 수 없어요. 명세서에 3.3%나 원천징수 표시가 있는지 확인해 보세요.`
        : `${ym} ${employer}: 입력한 내용을 바탕으로 '${r.incomeTypeLabel}'로 봤어요.${estimated ? " (떼인 세금을 비워 3.3%로 계산했어요)" : ""}`;
      상태저장(false);
      전체화면그리기();
    });

    // 앱 최초 시작
    이벤트초기화();
    전체화면그리기();
  </script>
</body>
</html>
